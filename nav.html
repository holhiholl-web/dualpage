<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>N7 아이카 내비</title>
<style>
:root{--bg:#0b0d10;--pn:rgba(20,23,28,.94);--pn2:#1f242c;--ln:rgba(255,255,255,.1);--tx:#eef1f5;--mu:#97a0ae;--ac:#3d7bff;--ok:#16a865;--gr:#0f9d58;--rd:#ff4757;--or:#ff9f1a;--r:.8rem;--bbh:clamp(2.9rem,12vh,4.2rem);--spd:clamp(2.6rem,11vw,4.2rem)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.18rem solid #9cc0ff;outline-offset:.1rem}
button:disabled{opacity:.42;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#mapw{position:fixed;inset:0;overflow:hidden;background:#d9dde2}
#mi{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 50%;will-change:transform}
#mi.tr{transition:transform .35s linear}
body.night #mapw{background:#11151b}body.night.cssnight #mi{filter:invert(.92) hue-rotate(180deg) brightness(.9) contrast(.9)}
#demoCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.carDom{position:absolute;z-index:5;width:3.4rem;height:3.4rem;margin:-1.7rem 0 0 -1.7rem;pointer-events:none;display:none}
/* 공통 패널 */
.glass{background:var(--pn);border:1px solid var(--ln);border-radius:1rem;box-shadow:0 .5rem 1.6rem rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn{height:3rem;min-width:3rem;padding:0 1rem;border-radius:var(--r);background:var(--pn2);border:1px solid var(--ln);font-size:1.05rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;white-space:nowrap}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.dan{background:var(--rd);border-color:var(--rd);color:#fff}
.btn:active{transform:scale(.96)}.btn.sm{height:2.4rem;font-size:.9rem;padding:0 .7rem;min-width:2.4rem}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:.1rem .4rem;border-radius:.35rem;vertical-align:middle;letter-spacing:.02em}
.tag.demo{background:var(--or);color:#1a1000}.tag.real{background:#1d7a4c;color:#dfffee}.tag.test{background:#8a3ffc;color:#fff}.tag.est{background:#555c68;color:#fff}
/* 상단 상태줄 */
#stat{position:fixed;z-index:40;right:.5rem;top:.5rem;display:flex;gap:.35rem;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.chip{height:2.1rem;padding:0 .7rem;border-radius:1.05rem;background:rgba(18,21,26,.88);border:1px solid var(--ln);font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.chip.real{color:#7dffb0}.chip.demo{color:#ffc46b}.chip.bad{color:#ff9aa4}.chip.test{color:#d6b8ff}
#rlc{position:static!important;height:2.1rem!important;padding:0 .7rem!important;border-radius:1.05rem!important;font-size:.82rem!important}
/* 검색 바 (대기 화면) */
#home{position:fixed;z-index:30;left:.6rem;top:.6rem;display:flex;flex-direction:column;gap:.45rem;max-width:min(30rem,52%)}
#sbtn{height:3.4rem;border-radius:1.7rem;padding:0 1.2rem;font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:.6rem;text-align:left;width:100%}
#sbtn span{color:var(--mu);font-weight:600}
#quick{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none}#quick::-webkit-scrollbar{display:none}
#quick .btn{height:2.5rem;font-size:.92rem;border-radius:1.25rem;background:rgba(18,21,26,.9);max-width:11rem;overflow:hidden;text-overflow:ellipsis}
/* 오른쪽 버튼 레일 */
#rail{position:fixed;z-index:35;right:.5rem;bottom:.5rem;display:flex;flex-direction:column;gap:.35rem;align-items:flex-end}
#rail .rb{--rb:max(36px,clamp(2.4rem,7.5vw,3rem));width:var(--rb);height:var(--rb);border-radius:50%;background:rgba(18,21,26,.9);border:1px solid var(--ln);font-size:clamp(1rem,3.2vw,1.3rem);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 .25rem .8rem rgba(0,0,0,.45);position:relative}
#rail .rb.on{background:var(--ac);border-color:var(--ac)}#rail .rb small{font-size:.58rem;position:absolute;bottom:.18rem;left:0;right:0;text-align:center;font-weight:700;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
#rail .rb.on small{color:#e8efff}
#zoomRow{display:flex;flex-direction:column;gap:.35rem}
#recenter{display:none;height:max(36px,2.8rem);padding:0 .9rem;border-radius:1.5rem;background:var(--ac);color:#fff;font-weight:800;font-size:.95rem;box-shadow:0 .25rem .8rem rgba(0,0,0,.45)}
body.free #recenter{display:inline-flex;align-items:center;gap:.3rem}
body.guiding #rail{bottom:calc(var(--bbh) + .45rem)}body.guiding #rail .hideG{display:none}
body.kb:not(.narrow) #kb{left:min(34rem,50%);height:min(100%,19rem);border-left:1px solid var(--ln)}body.kb:not(.narrow) #sp{bottom:0}
body.kb.narrow #spF .fld:not(:has(.act)){display:none}
/* 속도 */
#spd{position:fixed;z-index:34;left:.5rem;bottom:.5rem;width:var(--spd);height:var(--spd);border-radius:50%;background:rgba(255,255,255,.96);color:#111;border:.22rem solid #2b2f36;display:none;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 .3rem 1rem rgba(0,0,0,.45);overflow:visible}
#spd b{font-size:min(1.45rem,calc(var(--spd)*0.36));line-height:1;font-weight:900;letter-spacing:-.04em;max-width:90%;height:1em;max-height:1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#spd i{font-style:normal;font-size:clamp(8px,1.8vw,.68rem);font-weight:700;color:#555}#spd .tag{position:absolute;top:-.45rem}
#spd.over{border-color:var(--rd)}body.guiding #spd{bottom:calc(var(--bbh) + .4rem)}
#lim{position:fixed;z-index:34;left:calc(var(--spd) + .85rem);bottom:.85rem;width:clamp(2.2rem,8vw,3.2rem);height:clamp(2.2rem,8vw,3.2rem);border-radius:50%;background:#fff;border:.32rem solid #e3262f;color:#111;font-weight:900;font-size:clamp(11px,3vw,1.1rem);display:none;align-items:center;justify-content:center;overflow:hidden}
body.guiding #lim{bottom:calc(var(--bbh) + .7rem)}
/* 주행 상단 배너 — TMAP형 슬림 카드, 패널 크기에 비례 */
#tb{position:fixed;z-index:36;left:.5rem;top:.5rem;width:min(18rem,44%);max-width:calc(100% - 1rem);display:none;border-radius:.7rem;overflow:hidden;box-shadow:0 .35rem 1.1rem rgba(0,0,0,.45);container-type:inline-size;container-name:tb}
body.guiding #tb{display:block}
body.narrow #tb,body.tight #tb{width:min(18rem,calc(100% - 1rem))}
body.tb-collapsed #tb{width:max-content;min-width:8rem;max-width:calc(100% - 1rem);container-type:normal}
#tbm{background:var(--gr);color:#fff;display:flex;align-items:center;gap:.4rem;padding:.28rem .2rem .28rem .45rem;min-width:0}
#tbi{flex:none;width:clamp(1.65rem,8cqi,2.55rem);height:clamp(1.65rem,8cqi,2.55rem)}#tbi svg{width:100%;height:100%;display:block}
#tbt{min-width:0;flex:1;overflow:hidden}
#tbd{display:flex;align-items:baseline;gap:.28rem;min-width:0;font-size:clamp(1.05rem,9cqi,1.65rem);font-weight:900;line-height:1.05;letter-spacing:-.03em}
#tbd>b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit}
#tbr{font-size:clamp(.7rem,5.2cqi,.95rem);font-weight:700;margin-top:.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
#tbs{flex:none;display:inline-block;font-size:.62rem;font-weight:800;padding:.08rem .32rem;border-radius:.3rem;background:rgba(0,0,0,.25);line-height:1.2;white-space:nowrap}
#tbFold{flex:none;align-self:stretch;width:max(2.25rem,36px);min-width:max(2.25rem,36px);margin:0;padding:0;border:0;background:transparent;color:#fff;border-radius:.4rem;display:flex;align-items:center;justify-content:center}
#tbFold svg{width:1.15rem;height:1.15rem;display:block;transition:transform .15s}
#tbFold:active{background:rgba(0,0,0,.2)}
body.tb-collapsed #tbFold svg{transform:rotate(180deg)}
#tbn{background:#0b6e3e;color:#e8fff3;display:flex;align-items:center;gap:.28rem;padding:.16rem .55rem .2rem;font-size:clamp(.68rem,4.6cqi,.85rem);font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
#tbn .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tbn svg{width:1.15rem;height:1.15rem;flex:none}
#lanes{display:none;background:#1b1f26;padding:.28rem .45rem;gap:.22rem;align-items:center;overflow:hidden}
#lanes.on{display:flex}#lanes .ln{width:clamp(1.4rem,6cqi,2rem);height:clamp(1.5rem,6.5cqi,2.1rem);border-radius:.3rem;background:#2b313b;display:flex;align-items:center;justify-content:center;flex:none}#lanes .ln.hl{background:#2a8cff}#lanes svg{width:80%;height:80%}
#lanes .tag{flex:none}
body.tb-collapsed #tbr,body.tb-collapsed #tbn,body.tb-collapsed #lanes,body.tb-collapsed #tbs,body.tight #tbs{display:none!important}
body.tb-collapsed #tbm{padding:.16rem .12rem .16rem .38rem;gap:.3rem}
body.tb-collapsed #tbt{flex:0 1 auto;width:auto}body.tb-collapsed #tbi{width:1.65rem;height:1.65rem}
body.tb-collapsed #tbd{font-size:1.05rem}
#alerts{position:fixed;z-index:36;top:.5rem;left:calc(min(18rem,44%) + 1rem);display:flex;flex-direction:column;gap:.3rem;max-width:min(18rem,calc(100% - 6rem));min-width:0}
.al{padding:.4rem .65rem;border-radius:.65rem;font-weight:800;font-size:clamp(.78rem,2.4vw,.95rem);display:flex;gap:.4rem;align-items:center;background:rgba(18,21,26,.94);border:2px solid var(--or);min-width:0;max-width:100%;overflow:hidden}
.al.red{border-color:var(--rd)}.al.gray{border-color:#666}.al .ic{font-size:1.2rem;flex:none}.al>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 하단 바 */
#bb{position:fixed;z-index:36;left:0;right:0;bottom:0;height:var(--bbh);display:none;align-items:center;gap:.35rem;padding:0 .4rem;background:rgba(14,16,20,.96);border-top:1px solid var(--ln);min-width:0}
body.guiding #bb{display:flex}
#bbI{flex:1;display:flex;gap:clamp(.25rem,1.4vw,1.1rem);align-items:center;justify-content:space-evenly;min-width:0;overflow:hidden}
#bbI div{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;flex:1 1 0;overflow:hidden;max-width:100%}
#bbI b{font-size:clamp(11px,2.8vw,1.45rem);font-weight:900;max-width:100%;line-height:1.15;position:relative;overflow:visible;width:100%;text-align:center}#bbI b .v{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font:inherit;color:inherit}
#bbI>div>span{font-size:clamp(9px,1.4vw,.7rem);color:var(--mu);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#bbI .eta b{color:#7dc4ff}
body.narrow #bbI>div>span,body.short #bbI>div>span,body.tight #bbI>div>span{display:none}
#bbI b .tag{position:absolute;left:50%;top:-.05rem;transform:translate(-50%,-100%);font-size:.55rem;padding:.02rem .22rem;line-height:1.1;pointer-events:none}
#bb .btn.sm{height:calc(var(--bbh) - .45rem);min-height:0;min-width:calc(var(--bbh) - .45rem);font-size:clamp(.8rem,2.2vw,1.05rem);padding:0 .5rem;flex:none}
#prog{position:absolute;left:0;right:0;top:-.28rem;height:.28rem;background:rgba(255,255,255,.12)}#prog i{display:block;height:100%;background:#2a8cff;width:0}
/* 검색 패널 */
#sp{position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(34rem,50%);display:none;flex-direction:column;background:rgba(14,16,20,.97);border-right:1px solid var(--ln)}
body.sp #sp{display:flex}
#spH{display:flex;gap:.4rem;padding:.5rem;align-items:flex-start;flex:none}
#spF{flex:1;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.fld{display:flex;align-items:center;gap:.3rem}
.fld .lb{flex:none;width:2.6rem;font-size:.8rem;font-weight:800;color:var(--mu);text-align:center}
.fld .in{flex:1;min-width:0;height:2.7rem;border-radius:.6rem;background:var(--pn2);border:1px solid var(--ln);padding:0 .7rem;display:flex;align-items:center;font-size:1.02rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.fld .in.ph{color:var(--mu);font-weight:600}.fld .in.act{border-color:var(--ac);box-shadow:0 0 0 .15rem rgba(61,123,255,.35)}
.fld .x{width:2.3rem;height:2.3rem;min-width:0;padding:0;font-size:.9rem}
#spR{flex:1;overflow-y:auto;padding:0 .5rem .5rem;-webkit-overflow-scrolling:touch}
.res{display:flex;gap:.6rem;align-items:center;padding:.6rem .5rem;border-bottom:1px solid var(--ln);min-height:3.4rem}
.res .m{flex:1;min-width:0;text-align:left;background:none;padding:0}.res .n{font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.res .a{font-size:.82rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
.res .k{flex:none;font-size:.7rem;font-weight:800;color:#9cc0ff;border:1px solid #3a5a9a;border-radius:.3rem;padding:0 .3rem}
.msg{padding:1rem .6rem;color:var(--mu);font-size:.98rem;line-height:1.5}.msg b{color:var(--tx)}
/* 키패드 */
#kb{position:fixed;z-index:60;left:0;right:0;bottom:0;height:min(52%,17.5rem);display:none;flex-direction:column;gap:.3rem;padding:.35rem;background:rgba(10,12,15,.98);border-top:1px solid var(--ln)}
body.kb #kb{display:flex}body.kb #sp{bottom:min(52%,17.5rem)}
#kbP{display:flex;gap:.35rem;align-items:center;flex:none;height:2.6rem}
#kbT{flex:1;min-width:0;height:2.6rem;display:flex;align-items:center;padding:0 .7rem;border-radius:.6rem;background:var(--pn2);border:1px solid var(--ac);font-size:1.2rem;white-space:pre;overflow:hidden}
#kbT i{display:inline-block;width:2px;height:1.4rem;background:var(--ac);margin-left:1px;animation:blk 1s steps(1) infinite}@keyframes blk{50%{opacity:0}}
#kbL{flex:none;font-size:.8rem;color:var(--mu);font-weight:800}
#kbK{flex:1;display:flex;flex-direction:column;gap:.3rem;min-height:0}
.kr{flex:1;display:flex;gap:.3rem;min-height:0}.kr button{flex:1;min-width:0;border-radius:.5rem;background:#2a2f38;font-size:1.25rem;font-weight:700}
.kr button.f{background:#3a404b;font-size:.95rem}.kr button.w2{flex:1.5}.kr button.sp{flex:4}.kr button.go{flex:2;background:var(--ac);color:#fff}.kr button.on{background:var(--ac)}
/* 경로 후보 */
#rp{position:fixed;z-index:45;left:0;top:0;bottom:0;width:min(27rem,44%);display:none;flex-direction:column;background:rgba(14,16,20,.96);border-right:1px solid var(--ln)}
body.rp #rp{display:flex}
#rpH{padding:.55rem .6rem;display:flex;gap:.4rem;align-items:center;flex:none;border-bottom:1px solid var(--ln)}
#rpH .t{flex:1;min-width:0;font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rpL{flex:1;overflow-y:auto;padding:.4rem}
.rc{width:100%;text-align:left;padding:.6rem .7rem;border-radius:.8rem;background:var(--pn2);border:2px solid transparent;margin-bottom:.4rem;display:block}
.rc.sel{border-color:var(--ac);background:#1d2a44}.rc .h{display:flex;align-items:baseline;gap:.5rem}.rc .o{font-size:.85rem;font-weight:800;color:#9cc0ff}
.rc .tm{font-size:1.6rem;font-weight:900}.rc .d{font-size:.95rem;color:var(--mu);font-weight:700}.rc .s{font-size:.8rem;color:var(--mu);margin-top:.2rem;line-height:1.4}
#rpB{flex:none;display:flex;gap:.4rem;padding:.5rem;border-top:1px solid var(--ln);flex-wrap:wrap}#rpB .btn{flex:1}
#rpO{display:flex;gap:.3rem;padding:.3rem .6rem;flex-wrap:wrap;flex:none}
.seg{display:flex;gap:.25rem;flex-wrap:wrap}.seg button{height:2.2rem;padding:0 .6rem;border-radius:.55rem;background:var(--pn2);border:1px solid var(--ln);font-size:.82rem;font-weight:700}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
/* 메뉴·모달 */
.sheet{position:fixed;z-index:70;right:.6rem;top:3rem;bottom:.6rem;width:min(24rem,60%);display:none;flex-direction:column;overflow:hidden}
.sheet.on{display:flex}.sheet .hd{display:flex;align-items:center;padding:.6rem .7rem;gap:.4rem;border-bottom:1px solid var(--ln);font-weight:800;font-size:1.05rem}.sheet .hd span{flex:1}
.sheet .bd{flex:1;overflow-y:auto;padding:.6rem .7rem;font-size:.92rem;line-height:1.45}
.sheet h4{margin:.8rem 0 .35rem;font-size:.85rem;color:var(--mu)}.sheet h4:first-child{margin-top:0}
.sheet .grid{display:flex;flex-wrap:wrap;gap:.35rem}
table.fa{width:100%;border-collapse:collapse;font-size:.76rem}table.fa td,table.fa th{border-bottom:1px solid var(--ln);padding:.3rem .25rem;text-align:left;vertical-align:top}
#simp{position:fixed;z-index:38;right:4.6rem;bottom:5.6rem;width:min(21rem,42%);max-height:calc(100% - 12rem);display:none;flex-direction:column;overflow:hidden}
#simp.on{display:flex}#simp .hd{display:flex;gap:.35rem;align-items:center;padding:.45rem .55rem;border-bottom:1px solid var(--ln);flex-wrap:wrap}
#simEv{display:flex;flex-wrap:wrap;gap:.3rem;padding:.45rem .55rem}#simEv .btn{flex:1 1 30%}
#simTl{flex:1;overflow-y:auto;padding:.2rem .55rem .5rem;font-size:.78rem;color:var(--mu);max-height:7rem}#simTl div{padding:.12rem 0;border-bottom:1px dashed var(--ln)}
#toast{position:fixed;z-index:90;left:50%;top:4rem;transform:translateX(-50%);max-width:min(36rem,92%);padding:.7rem .9rem;display:none;gap:.6rem;align-items:center;font-size:.98rem;font-weight:700}
#toast.on{display:flex}#toast.err{border-color:rgba(255,71,87,.7)}#toast .tx{flex:1;line-height:1.4}#toast .tx small{display:block;color:var(--mu);font-weight:600;font-size:.82rem}
#cf{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}#cf.on{display:flex}#cf .box{padding:1.1rem 1.2rem;max-width:90%;text-align:center}#cf p{font-size:1.15rem;font-weight:800;margin:0 0 .9rem}#cf .btn{min-width:7rem;margin:0 .25rem}
#arr{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);padding:1.2rem 1.6rem;text-align:center;display:none}#arr.on{display:block}#arr h3{margin:.2rem 0 .8rem;font-size:1.5rem}
#gpsBan{position:fixed;z-index:37;left:50%;transform:translateX(-50%);top:.6rem;display:none;padding:.5rem .9rem;font-weight:800;font-size:.95rem;border-color:rgba(255,159,26,.7)}
#gpsBan.on{display:block}body.guiding #gpsBan{top:auto;bottom:5.7rem}
#ver{position:fixed;z-index:20;left:.3rem;bottom:.15rem;font-size:.62rem;color:#6b7380;pointer-events:none}body.guiding #ver{display:none}
#modeBadge{display:none}body.sim #modeBadge{display:inline-flex}
/* 좁은 화면(사이드 패널·세로폰) */
body.narrow #sp,body.narrow #rp{width:100%}body.narrow #home{max-width:calc(100% - 1.2rem);top:3rem}body.narrow #stat{max-width:calc(100% - 1rem);left:.5rem;justify-content:flex-start}
body.narrow #alerts,body.tight #alerts{left:.5rem;top:auto;bottom:calc(var(--bbh) + .45rem);max-width:calc(100% - 5.2rem)}body.narrow.guiding #stat,body.tight.guiding #stat{display:none}
body.narrow #simp{right:.5rem;left:.5rem;width:auto;bottom:var(--bbh)}body.narrow .sheet{left:.5rem;right:.5rem;width:auto}
body.narrow.guiding #rail .hideN{display:none}

<script>
const HG=(()=>{const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',JONG=' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
 const VC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
 const JC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
 const JS={};for(const k in JC)JS[JC[k]]=[k[0],k[1]];
 const isV=c=>JUNG.includes(c),isC=c=>CHO.includes(c)||JONG.indexOf(c)>0;
 const mk=(c,j,t)=>String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(j))*28+(t?JONG.indexOf(t):0));
 const dec=ch=>{const n=ch.charCodeAt(0)-0xAC00;if(n<0||n>11171)return null;return[CHO[Math.floor(n/588)],JUNG[Math.floor(n%588/28)],n%28?JONG[n%28]:'']};
 // st={text, hist:[]}  hist non-empty = composing last char
 function key(st,k){const t=st.text,last=t.slice(-1),pre=t.slice(0,-1),comp=st.hist.length>0;
  const push=nt=>{st.hist.push(t);st.text=nt};
  if(isV(k)){
   if(comp){const d=dec(last);
    if(d&&d[2]){let a=d[2],b='';if(JS[a]){[a,b]=JS[a]}else{b=a;a=''}
     if(CHO.includes(b)){const base=pre+mk(d[0],d[1],a);st.hist=[base,base+b];st.text=base+mk(b,k);return st}}
    else if(d&&!d[2]&&VC[d[1]+k]){push(pre+mk(d[0],VC[d[1]+k]));return st}
    else if(!d&&CHO.includes(last)){push(pre+mk(last,k));return st}
    else if(!d&&VC[last+k]){push(pre+VC[last+k]);return st}}
   st.hist=[t];st.text=t+k;return st}
  if(isC(k)){
   if(comp){const d=dec(last);
    if(d&&!d[2]&&JONG.indexOf(k)>0){push(pre+mk(d[0],d[1],k));return st}
    if(d&&d[2]&&JC[d[2]+k]){push(pre+mk(d[0],d[1],JC[d[2]+k]));return st}}
   st.hist=[t];st.text=t+k;return st}
  st.hist=[];st.text=t+k;return st}
 function back(st){if(st.hist.length){st.text=st.hist.pop()}else st.text=st.text.slice(0,-1);return st}
 function type(seq){const st={text:'',hist:[]};for(const c of seq){if(c=='\b')back(st);else key(st,c)}return st.text}
 return{key,back,type,commit:st=>{st.hist=[];return st}}})();

const VOICE = { ok: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined', failed: false, last: '', lastAt: 0 };
function speak(text, force) {
  say(text); if (!text) return false;
  if (!ST.voice || !S.voiceGest || !VOICE.ok || VOICE.failed) return false;
  if (!force && text === VOICE.last && Date.now() - VOICE.lastAt < 4000) return false;
  VOICE.last = text; VOICE.lastAt = Date.now();
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.volume = ST.vol; u.rate = 1.05; const v = speechSynthesis.getVoices().find(v => /ko/i.test(v.lang)); if (v) u.voice = v; u.onerror = ev => { if (ev.error && ev.error !== 'interrupted' && ev.error !== 'canceled') { VOICE.failed = true; toast('음성 합성에 실패했습니다.', '텍스트 안내로 계속합니다.', null, true); } }; speechSynthesis.cancel(); speechSynthesis.speak(u); return true; }
  catch (e) { VOICE.failed = true; return false; }

// ---------- API 어댑터 (실제 TMAP 프록시 / 데모) ----------
const ctrls = {};
async function call(chan, path, opt) {
  if (ctrls[chan]) ctrls[chan].abort(); const ac = new AbortController(); ctrls[chan] = ac; const to = setTimeout(() => ac.abort('timeout'), 9000);
  let r; try { r = await fetch(W_API + path, Object.assign({ signal: ac.signal, cache: 'no-store' }, opt || {})); }
  catch (e) { clearTimeout(to); if (ac.signal.aborted) throw new C.ApiError(ac.signal.reason === 'timeout' ? 'TIMEOUT' : 'ABORTED'); throw new C.ApiError('NETWORK'); }
  clearTimeout(to); if (ctrls[chan] === ac) delete ctrls[chan];
  let j = null; try { j = await r.json(); } catch (e) { throw new C.ApiError('BAD_RESPONSE'); }
  if (!j || j.ok !== true) throw new C.ApiError((j && j.code) || 'UPSTREAM', j && j.message);

    if (out.length < 3 && /\d/.test(q) && /(로|길|동|읍|면|리)\s*\d|번지/.test(q)) { try { const g = await call('geo', '/geo?addr=' + encodeURIComponent(q)); out = C.mapGeoResponse(g.data, q).concat(out); } catch (e) { if (e.code !== 'BAD_REQUEST') throw e; } } return out; },
  async around(cat, p) { const j = await call('poi', '/around?cat=' + encodeURIComponent(cat) + '&lat=' + p.lat.toFixed(6) + '&lon=' + p.lon.toFixed(6) + '&r=3'); return C.mapPoiResponse(j.data); },
  async rev(p) { const j = await call('rev', '/rev?lat=' + p.lat.toFixed(6) + '&lon=' + p.lon.toFixed(6)); return C.mapRev(j.data); },
  async route(a, b, via, option, extra) { const body = { start: { lat: a.lat, lon: a.lon }, end: { lat: b.lat, lon: b.lon }, via: via.map(v => ({ lat: v.lat, lon: v.lon })), option, carType: ST.carType }; if (extra && C.isNum(extra.angle)) body.angle = extra.angle;
    const j = await call('route' + option + ((extra && extra.chan) || ''), '/route', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return C.mapRoute(j.data, { option, source: 'tmap' }); }
};
