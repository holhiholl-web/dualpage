<script>
const S=localStorage,API=['https://api.piped.private.coffee','https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de'];
let st=JSON.parse(S.v10t||'{}');const sv=()=>S.v10t=JSON.stringify(st);
const TK='iSBCMHTI7D2DqUdLdiY5U2aS4XZZEIgl5ATPkc9g',TA='https://apis.openapi.sk.com/tmap';
const T=Tmapv2,LL=(a,b)=>new T.LatLng(a,b);const c0=st.c||[35.16,126.85];
const map=new T.Map('map',{center:LL(c0[0],c0[1]),width:'100%',height:'100%',zoom:st.z||15,zoomControl:false,scrollwheel:true});
function fit0(){const w=document.getElementById('mapw'),e=document.getElementById('map');const W=w.clientWidth,H=w.clientHeight;if(!W||!H)return;e.style.width=W+'px';e.style.height=H+'px';try{map.resize(W,H)}catch(x){}}
function fit(){fit0();requestAnimationFrame(fit0);setTimeout(fit0,300)}
if(window.ResizeObserver)new ResizeObserver(fit).observe(document.getElementById('mapw'));addEventListener('resize',fit);addEventListener('orientationchange',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);addEventListener('load',fit);fit();
function svc(){try{const c=map.getCenter();st.c=[c.lat(),c.lng()];st.z=map.getZoom();sv()}catch(e){}}map.addListener('dragend',svc);map.addListener('zoom_changed',svc);
let mk=null,mk2=null,line=null,here=null;
function rm(o){if(o)o.setMap(null)}
function pin(a,b,t){rm(mk);mk=new T.Marker({position:LL(a,b),map,title:t||''});map.setCenter(LL(a,b));map.setZoom(16)}
function msg(t,e){info.hidden=!t;info.textContent=t||'';info.className='info'+(e?' e':'')}
q.onkeydown=e=>{if(e.key=='Enter')route()};v.onkeydown=e=>{if(e.key=='Enter')go()};
function myPos(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>{here=[p.coords.latitude,p.coords.longitude];ok(here)},e=>no(new Error('위치 권한 실패: '+e.message)),{enableHighAccuracy:true,timeout:15000}))}
async function me(){try{const[a,b]=await myPos();pin(a,b,'내 위치');from.value=''}catch(e){msg(e.message,1)}}
// 장소 찾기: TMAP POI 통합검색 (내 위치 기준 거리순)
async function find(s){if(!here)try{await myPos()}catch(e){}
 const c=here||[map.getCenter().lat(),map.getCenter().lng()];
 const u=TA+'/pois?version=1&count=15&reqCoordType=WGS84GEO&resCoordType=WGS84GEO&searchKeyword='+encodeURIComponent(s)+'&centerLat='+c[0]+'&centerLon='+c[1];
 const r=await fetch(u,{headers:{appKey:TK}});if(r.status==204)return[];const j=await r.json();const P=((j.searchPoiInfo||{}).pois||{}).poi||[];
 const L=P.map(x=>({n:x.name+', '+[x.upperAddrName,x.middleAddrName,x.lowerAddrName,x.roadName&&x.firstBuildNo?x.roadName+' '+x.firstBuildNo:x.detailAddrName].filter(Boolean).join(' '),lat:+(x.frontLat||x.noorLat),lng:+(x.frontLon||x.noorLon)}));
 if(here)L.sort((a,b)=>km(here[0],here[1],a.lat,a.lng)-km(here[0],here[1],b.lat,b.lng));return L}
function km(a,b,c,d){const R=6371e3,t=Math.PI/180,x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function pick(list){return new Promise(ok=>{pl.innerHTML='<div style="background:#333">후보를 선택하세요 ✕</div>';pl.firstChild.onclick=()=>{pl.hidden=true;msg('취소됨')};list.forEach(x=>{const d=document.createElement('div');d.textContent=x.n+(here?'  ('+(km(here[0],here[1],x.lat,x.lng)/1000).toFixed(1)+'km)':'');d.onclick=()=>{pl.hidden=true;ok(x)};pl.appendChild(d)});pl.hidden=false})}
async function sp(){try{const s=q.value.trim();if(!s)return;const l=await find(s);if(!l.length)return msg('결과 없음',1);const x=await pick(l);pin(x.lat,x.lng,x.n);msg('')}catch(e){msg('오류: '+e.message,1)}}
async function route(){try{const s=q.value.trim();if(!s)return msg('도착지를 입력하세요',1);
 let A;if(from.value.trim()){const l=await find(from.value.trim());if(!l.length)return msg('출발지 결과 없음',1);const x=await pick(l);A=[x.lat,x.lng];ORG=x.n.split(',')[0]}else{ORG='';msg('내 위치 확인 중…');A=await myPos()}
 const l=await find(s);if(!l.length)return msg('도착지 결과 없음',1);const B=await pick(l);DEST=B;
 await drawRoute(A,B);}catch(e){msg('오류: '+e.message,1)}}
window.RTdbg=()=>RT;let ORG='',DEST=null,RT=null,WID=null,SND=true,off=0,gi=0,spoken={},rer=false;
async function drawRoute(A,B,nav){if(!nav)msg('경로 검색 중…');
 const r=await fetch(TA+'/routes?version=1&format=json',{method:'POST',headers:{appKey:TK,'Content-Type':'application/json'},body:JSON.stringify({startX:''+A[1],startY:''+A[0],endX:''+B.lng,endY:''+B.lat,reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchOption:'0',trafficInfo:'N'})});
 const j=await r.json();if(!j.features)return msg('길찾기 실패: '+((j.error&&j.error.message)||r.status),1);
 const path=[],guide=[],alerts=[];let sm=null;
 for(const f of j.features){const g=f.geometry,p=f.properties;
  if(g.type=='LineString'){for(const c of g.coordinates){const l=path[path.length-1];if(!l||l[0]!=c[0]||l[1]!=c[1])path.push(c)}}
  else if(g.type=='Point'){if(p.pointType=='S'&&p.totalDistance!=null)sm=p;if(!path.length)path.push(g.coordinates);
   const tt=+p.turnType,ds=p.description||'';if((tt>=191&&tt<=194)||/카메라|단속/.test(ds)){alerts.push({pointIndex:Math.max(0,path.length-1),turn:tt,text:ds})}else if(p.pointType!='S'&&tt!=200)guide.push({pointIndex:Math.max(0,path.length-1),instructions:p.description,turn:p.turnType})}}
 if(!sm)sm=j.features[0].properties;
 RT={path,guide,alerts,dur:sm.totalTime*1000,dist:sm.totalDistance,ci:0};gi=0;spoken={};AL={};
 rm(line);rm(mk);rm(mk2);
 const pp=path.map(p=>LL(p[1],p[0]));line=new T.Polyline({map,path:pp,strokeColor:'#e8303a',strokeWeight:8,strokeOpacity:.9});
 mk=new T.Marker({map,position:pp[0]});mk2=new T.Marker({map,position:pp[pp.length-1]});
 if(!nav){const b=new T.LatLngBounds();pp.forEach(p=>b.extend(p));map.fitBounds(b,{top:40,right:40,bottom:40,left:40});}
 const m=Math.round(sm.totalTime/60);(nav?()=>{}:msg)('🚗 총 '+(sm.totalDistance/1000).toFixed(1)+'km · '+(m>=60?Math.floor(m/60)+'시간 ':'')+m%60+'분 · 통행료 '+(sm.totalFare||0).toLocaleString()+'원 · 택시비 약 '+(sm.taxiFare||0).toLocaleString()+'원'+(DEST?' · '+(ORG||'내 위치')+' → '+DEST.n.split(',')[0]:''));if(!nav){const nb=document.createElement('button');nb.textContent='▶ 안내 시작';nb.onclick=startNav;info.appendChild(nb);info.hidden=false}}
function say(t){if(!SND||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.cancel();speechSynthesis.speak(u)}
function tSnd(){SND=!SND;snd.textContent=SND?'🔊':'🔇';st.snd=SND;sv()}
function TI(t){t=+t;if(t==12||t==16||t==17)return'↰';if(t==13||t==18||t==19)return'↱';if(t==14)return'↶';if(t==201)return'🏁';if(t>=125&&t<=129)return'⤴';return'↑'}
function fmt(m){return m>=1000?(m/1000).toFixed(1)+'km':Math.round(m/10)*10+'m'}
const DOT='<div style="width:22px;height:22px;border-radius:50%;background:#2a7fff;border:4px solid #fff;box-shadow:0 0 6px #000"></div>';
function startNav(){if(!RT)return;SND=st.snd!==false;snd.textContent=SND?'🔊':'🔇';navbtn.style.display='none';nav.style.display='block';info.hidden=true;setTimeout(fit,50);if(here)map.setCenter(LL(here[0],here[1]));map.setZoom(17);say('경로 안내를 시작합니다');
 if(!mk3)mk3=new T.Marker({map,position:map.getCenter(),iconHTML:DOT,iconSize:new T.Size(30,30)});
 WID=navigator.geolocation.watchPosition(onPos,e=>{if(nI.textContent=='-')nI.textContent='위치 오류: '+e.message},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
let mk3=null;
function stopNav(silent){HD=0;PH=null;setTimeout(applyView,0);if(WID!=null)navigator.geolocation.clearWatch(WID);WID=null;nav.style.display='none';if(mk3){mk3.setMap(null);mk3=null}if(RT)info.hidden=false;if(!silent)say('안내를 종료합니다')}
function near(lat,lng){let bi=0,bd=1e9;const P=RT.path;const a=RT.ci||0,b=Math.min(P.length,a+300);for(let i=a;i<b;i++){const d=km(lat,lng,P[i][1],P[i][0]);if(d<bd){bd=d;bi=i}}if(bd<=50){RT.ci=bi;return[bi,bd]}bd=1e9;for(let i=0;i<P.length;i++){const d=km(lat,lng,P[i][1],P[i][0]);if(d<bd){bd=d;bi=i}}if(bd<=50)RT.ci=bi;return[bi,bd]}
function along(i,j){let d=0;const P=RT.path;for(let k=i;k<j&&k<P.length-1;k++)d+=km(P[k][1],P[k][0],P[k+1][1],P[k+1][0]);return d}
async function onPos(p){if(!RT||rer)return;const lat=p.coords.latitude,lng=p.coords.longitude;if(!isFinite(lat)||!isFinite(lng))return;here=[lat,lng];const ll=LL(lat,lng);if(mk3)mk3.setPosition(ll);map.setCenter(ll);
 if(PH){const dd=km(PH[0],PH[1],lat,lng);if(dd>5){HD=brg(PH,[lat,lng]);PH=[lat,lng]}}else PH=[lat,lng];if(isFinite(p.coords.heading)&&p.coords.heading!=null&&(p.coords.speed||0)>1)HD=p.coords.heading;applyView();
 const[i,d]=near(lat,lng);
 if(d>50&&(p.coords.accuracy||0)<60){if(++off>=3){off=0;rer=true;nI.textContent='경로 재탐색 중…';toast('경로를 재탐색합니다','i','🔄');say('경로를 재탐색합니다');try{await drawRoute(here,DEST,1)}catch(e){}rer=false}return}off=0;
 const P=RT.path,last=P[P.length-1];const rem=Math.min(RT.dist,along(i,P.length-1));
 if(rem<30||(km(lat,lng,last[1],last[0])<20&&i>=P.length-3)){nT.textContent='🏁';toast('목적지에 도착했습니다','ok','🏁');nI.textContent='🏁 목적지 도착';nD.textContent='';nR.textContent='';say('목적지에 도착했습니다. 안내를 종료합니다');stopNav(1);navbtn.style.display='none';return}
 chkAlert(i);
 while(gi<RT.guide.length&&RT.guide[gi].pointIndex<=i)gi++;const g=RT.guide[gi];
 const remT=Math.round(RT.dur*(rem/RT.dist)/60000);nR.textContent='남은 '+fmt(rem)+' · '+remT+'분';
 if(g){const dg=along(i,g.pointIndex);nI.textContent=g.instructions;nT.textContent=TI(g.turn);nD.textContent=fmt(dg);
  if(dg<300&&dg>=100&&!spoken[gi+'a']){spoken[gi+'a']=1;say(fmt(dg)+' 앞에서 '+g.instructions)}
  if(dg<60&&!spoken[gi+'b']){spoken[gi+'b']=1;say('잠시 후 '+g.instructions)}}
 else{nT.textContent='↑';nI.textContent='목적지까지 직진';nD.textContent=fmt(rem)}}
function vid(s){s=s.trim();if(/^[\w-]{11}$/.test(s))return s;const m=s.match(/(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/);return m&&m[1]}
function play(id){res.style.display='none';yt.querySelectorAll('iframe').forEach(f=>f.remove());const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;

j.items.filter(x=>x.url).forEach(x=>{const d=document.createElement('div');d.className='it';d.innerHTML='<img src="'+x.thumbnail+'"><span></span>';d.lastChild.textContent=x.title;d.onclick=()=>play(x.url.split('v=')[1]);res.appendChild(d)});return}catch(e){}}
res.innerHTML='<div class="it">검색 실패 — 유튜브 링크를 붙여넣어 주세요</div>'}

 if(te){te.classList.toggle('nt',n);me.classList.remove('nt')}else me.classList.toggle('nt',n);
 document.body.classList.toggle('night',n);bth.textContent=n?'🌙':'☀️';b3d.classList.toggle('on',M.v=='3d');
 document.querySelectorAll('#sett .seg button').forEach(b=>b.classList.toggle('on',M[b.dataset.k]==b.dataset.v));

 if(M.v=='3d')t+='perspective(900px) rotateX(38deg) ';if(rot)t+='rotate('+(-rot)+'deg) ';
 if(M.v=='3d'||rot)t+='scale('+(M.v=='3d'?1.55:1.45)+')';me.style.transform=t;cmp.firstChild.style.transform='rotate('+(-rot)+'deg)'}
function brg(a,b){const r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return(Math.atan2(y,x)/r+360)%360}

 if(a.turn==193)return['전방 급커브','w','↪'];return['전방 낙석주의','w','🪨']}
