<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K1 아이카 스마트 노래방</title>
<style>
:root{--bg:#0a0b10;--pn:#14161d;--pn2:#1d2029;--ln:rgba(255,255,255,.08);--tx:#f1f3f8;--mu:#8d95a6;--ac:#ff3d7f;--ac2:#7b5cff;--ok:#1fbf6a;--rd:#ff4757;--r:14px;--ly:34px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden;user-select:none}
button{flex:none;height:48px;min-width:48px;padding:0 14px;border:1px solid var(--ln);border-radius:var(--r);background:var(--pn2);color:var(--tx);font-size:17px;font-weight:600;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.96)}button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0}button.on{background:var(--ac2);border-color:var(--ac2)}button.i{padding:0;width:48px}
#wrap{display:flex;height:100vh}#P{flex:0 0 65%;display:flex;flex-direction:column;min-width:0}#S{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--pn);border-left:1px solid var(--ln);position:relative}
.bar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--pn);border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.brand{font-weight:800;font-size:18px;padding:0 6px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.vol{font-size:14px;color:var(--mu);min-width:34px;text-align:center}
#pw{flex:1;position:relative;background:#000;min-height:0}#pw>div,#pw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#idle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mu);font-size:20px;text-align:center;background:radial-gradient(circle at 50% 40%,#2a1a3a,#000 70%)}#idle b{font-size:34px;color:var(--tx)}
#ly{flex:none;height:calc(var(--ly)*3.2);padding:8px 16px;background:linear-gradient(#0d0e14,#07070b);border-top:1px solid var(--ln);display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden;position:relative}
body.lyoff #ly{display:none}
#l1{font-size:var(--ly);font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 0 18px rgba(255,61,127,.55)}#l1 span{background:linear-gradient(90deg,#ffd84d,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent}
#l2{font-size:calc(var(--ly)*.72);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lcd{position:absolute;right:16px;top:8px;display:flex;gap:8px}#lcd i{width:16px;height:16px;border-radius:50%;background:var(--ac)}#lcd i.off{background:#333}
#lsrc{position:absolute;right:14px;bottom:4px;font-size:11px;color:#555}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--ln)}.tabs button{flex:1;padding:0 6px;font-size:16px}
.pane{flex:1;overflow:auto;padding:6px;display:none;min-height:0}.pane.on{display:block}
.srow{display:flex;gap:6px;margin-bottom:6px}.srow input{flex:1;min-width:0;height:48px;border-radius:var(--r);border:1px solid var(--ln);background:var(--pn2);color:var(--tx);font-size:18px;padding:0 12px;outline:none;caret-color:transparent}.srow input.act{border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;scrollbar-width:none}.chips button{height:44px;font-size:15px;border-radius:22px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.h{font-size:15px;color:var(--mu);margin:6px 2px}
.it{display:flex;gap:8px;align-items:center;padding:6px;border-radius:var(--r);background:var(--pn2);margin-bottom:6px}
.it img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:#222}.it .t{flex:1;min-width:0;cursor:pointer}.it .t b{display:block;font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.it .t small{color:var(--mu);font-size:13px}
.it button{height:44px;min-width:44px;padding:0 8px;font-size:15px}.it .n{flex:none;width:28px;text-align:center;font-weight:800;color:var(--ac)}
.it.cur{outline:2px solid var(--ac)}
.empty{color:var(--mu);text-align:center;padding:24px 8px;font-size:16px}
#toast{position:fixed;z-index:2000;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;transition:.25s;padding:12px 18px;border-radius:16px;background:rgba(20,22,29,.95);border:1px solid var(--ln);font-size:17px;pointer-events:none;max-width:80vw}#toast.show{opacity:1;transform:translate(-50%,0)}
body.fs #S,body.fs #P>.bar{display:none}body.fs #P{flex:1}#fsx{display:none;position:fixed;z-index:1500;right:10px;top:10px;background:rgba(20,22,29,.8)}body.fs #fsx{display:block}
#kb{position:fixed;z-index:1800;left:0;right:0;bottom:0;display:none;flex-direction:column;gap:5px;padding:6px;background:rgba(14,15,20,.98);border-top:1px solid var(--ln);box-shadow:0 -10px 30px #000a;height:max(52vh,272px)}#kb.on{display:flex}
#kbP{display:flex;gap:6px;align-items:center;height:44px;flex:none}#kbT{flex:1;min-width:0;height:44px;display:flex;align-items:center;padding:0 12px;border-radius:12px;background:var(--pn2);border:1px solid var(--ac);font-size:20px;white-space:pre;overflow:hidden}
#kbT i{display:inline-block;width:2px;height:24px;background:var(--ac);margin-left:1px;animation:blk 1s steps(1) infinite}@keyframes blk{50%{opacity:0}}#kbP button{height:44px}
.kr{display:flex;gap:5px;flex:1;min-height:44px}.kr button{flex:1 1 0;min-width:0;height:auto;padding:0;font-size:22px;font-weight:500;border-radius:10px;background:#2a2d38;border:0}
.kr button.f{background:#3a3e4b;font-size:17px}.kr button.w2{flex:1.6}.kr button.sp{flex:4.5}.kr button.go{flex:2;background:linear-gradient(135deg,var(--ac),var(--ac2))}.kr button.on{background:var(--ac2)}
@media (max-width:1100px){.bar .brand,.bar #vv{display:none}.bar button{padding-left:9px;padding-right:9px}.bar .x{display:none}.it img{width:72px}}
</style></head><body>
<button id="fsx" onclick="fsT()">⤢ 패널</button>
<div id="wrap"><div id="P"><div class="bar"><a href="./dual.html"><button>🧭 내비</button></a><span class="brand">아이카 노래방</span>
<button onclick="restart()" title="처음부터">⏮</button><button id="bpp" onclick="pp()">⏯</button><button onclick="next()" title="다음곡">⏭ 다음곡</button>
<button class="i" onclick="vol(-10)">🔉</button><span class="vol" id="vv">80</span><button class="i" onclick="vol(10)">🔊</button>
<button id="blo" onclick="lyT()">가사</button><button id="bfz" onclick="fz()">글자 M</button><button class="i x" onclick="off(-.5)">−</button><span class="vol x" id="ofs">0.0s</span><button class="i x" onclick="off(.5)">+</button><button onclick="fsT()">⤢ 크게</button></div>
<div id="pw"><div id="idle"><b>🎤 아이카 스마트 노래방</b>노래를 검색해서 예약하세요</div><div id="yt"></div></div>
<div id="ly"><div id="lcd"></div><div id="l1">♪</div><div id="l2"></div><div id="lsrc"></div></div></div>
<div id="S"><div class="tabs"><button data-t="s" class="on" onclick="tab('s')">🔎 검색</button><button data-t="q" onclick="tab('q')">📋 예약 <span id="qn"></span></button><button data-t="f" onclick="tab('f')">⭐ 즐겨찾기</button><button data-t="r" onclick="tab('r')">🕘 최근</button></div>
<div class="pane on" id="ps"><div class="srow"><input id="sq" readonly inputmode="none" placeholder="제목 · 가수 검색"><button id="bmr" onclick="mrT()">노래방</button><button class="p" onclick="search()">검색</button></div><div class="chips" id="rs"></div><div id="sr"></div></div>
<div class="pane" id="pq"></div><div class="pane" id="pf"></div><div class="pane" id="pr"></div></div></div>
<div id="kb"><div id="kbP"><div id="kbT"><span id="kbS"></span><i></i></div><button onclick="kbClear()">지우기</button><button onclick="kbClose()">✕</button></div><div id="kbK" style="display:flex;flex-direction:column;gap:5px;flex:1"></div></div>
<div id="toast"></div>
<script>
/*HG*/
const HG=(()=>{const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',JONG=' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
 const VC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
 const JC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
 const JS={};for(const k in JC)JS[JC[k]]=[k[0],k[1]];
 const isV=c=>JUNG.includes(c),isC=c=>CHO.includes(c)||JONG.indexOf(c)>0;
 const mk=(c,j,t)=>String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(j))*28+(t?JONG.indexOf(t):0));
 const dec=ch=>{const n=ch.charCodeAt(0)-0xAC00;if(n<0||n>11171)return null;return[CHO[Math.floor(n/588)],JUNG[Math.floor(n%588/28)],n%28?JONG[n%28]:'']};
 // st={text, hist:[]}  hist non-empty = composing last char
 function key(st,k){const t=st.text,last=t.slice(-1),pre=t.slice(0,-1),comp=st.hist.length>0;
  const push=nt=>{st.hist.push(t);st.text=nt};
  if(isV(k)){
   if(comp){const d=dec(last);
    if(d&&d[2]){let a=d[2],b='';if(JS[a]){[a,b]=JS[a]}else{b=a;a=''}
     if(CHO.includes(b)){const base=pre+mk(d[0],d[1],a);st.hist=[base,base+b];st.text=base+mk(b,k);return st}}
    else if(d&&!d[2]&&VC[d[1]+k]){push(pre+mk(d[0],VC[d[1]+k]));return st}
    else if(!d&&CHO.includes(last)){push(pre+mk(last,k));return st}
    else if(!d&&VC[last+k]){push(pre+VC[last+k]);return st}}
   st.hist=[t];st.text=t+k;return st}
  if(isC(k)){
   if(comp){const d=dec(last);
    if(d&&!d[2]&&JONG.indexOf(k)>0){push(pre+mk(d[0],d[1],k));return st}
    if(d&&d[2]&&JC[d[2]+k]){push(pre+mk(d[0],d[1],JC[d[2]+k]));return st}}
   st.hist=[t];st.text=t+k;return st}
  st.hist=[];st.text=t+k;return st}
 function back(st){if(st.hist.length){st.text=st.hist.pop()}else st.text=st.text.slice(0,-1);return st}
 function type(seq){const st={text:'',hist:[]};for(const c of seq){if(c=='\b')back(st);else key(st,c)}return st.text}
 return{key,back,type,commit:st=>{st.hist=[];return st}}})();
/*HG*/
// ===== 아이카 스마트 노래방 K1 =====
const LS=localStorage,K='k1';let st={};try{st=JSON.parse(LS[K]||'{}')}catch(e){}const sv=()=>{try{LS[K]=JSON.stringify(st)}catch(e){}};
st.q=st.q||[];st.fav=st.fav||[];st.rec=st.rec||[];st.rs=st.rs||[];st.off=st.off||{};st.mr=st.mr||'노래방';st.vol=st.vol??80;st.fz=st.fz||'M';
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=s=>s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'';
// --- 검색 (Piped → Invidious 다중 인스턴스) ---
const PIPED=['https://api.piped.private.coffee','https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de'],INV=['https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yewtu.be'];
async function jget(u,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)return null;return await r.json()}catch(e){return null}finally{clearTimeout(t)}}
async function ytSearch(q){for(const a of PIPED){const j=await jget(a+'/search?filter=videos&q='+encodeURIComponent(q));if(j&&j.items&&j.items.length)return j.items.filter(x=>x.url&&x.url.includes('v=')).map(x=>({id:x.url.split('v=')[1].slice(0,11),t:x.title,c:x.uploaderName||'',d:x.duration||0,th:x.thumbnail}))}
 for(const a of INV){const j=await jget(a+'/api/v1/search?type=video&q='+encodeURIComponent(q));if(Array.isArray(j)&&j.length)return j.filter(x=>x.videoId).map(x=>({id:x.videoId,t:x.title,c:x.author||'',d:x.lengthSeconds||0,th:'https://i.ytimg.com/vi/'+x.videoId+'/mqdefault.jpg'}))}return null}
function row(x,mode,i){const d=document.createElement('div');d.className='it'+(mode=='q'&&i==0&&CUR&&CUR.id==x.id?' cur':'');
 d.innerHTML=(mode=='q'?'<span class="n">'+(i+1)+'</span>':'')+'<img loading="lazy"><div class="t"><b></b><small></small></div>';d.querySelector('img').src=x.th||('https://i.ytimg.com/vi/'+x.id+'/mqdefault.jpg');
 d.querySelector('b').textContent=x.t;d.querySelector('small').textContent=[x.c,fmtD(x.d)].filter(Boolean).join(' · ');d.querySelector('.t').onclick=()=>playNow(x);
 const B=(t,f,ti)=>{const b=document.createElement('button');b.textContent=t;if(ti)b.title=ti;b.onclick=e=>{e.stopPropagation();f()};d.appendChild(b)};
 const isF=st.fav.some(f=>f.id==x.id);
 if(mode=='q'){B('▲',()=>mv(i,-1),'위로');B('▼',()=>mv(i,1),'아래로');B('✕',()=>{st.q.splice(i,1);sv();rq();toast('예약 취소')},'취소')}
 else{B('예약',()=>reserve(x));B('우선',()=>reserve(x,1),'우선예약');B(isF?'★':'☆',()=>{favT(x);d.lastChild.textContent=st.fav.some(f=>f.id==x.id)?'★':'☆'},'즐겨찾기')}
 return d}
function list(el,arr,mode,emp){el.innerHTML='';if(!arr.length){el.innerHTML='<div class="empty">'+emp+'</div>';return}arr.forEach((x,i)=>el.appendChild(row(x,mode,i)))}
async function search(q){q=(q??$('sq').value).trim();if(!q)return home();$('sq').value=q;st.rs=[q].concat(st.rs.filter(x=>x!=q)).slice(0,8);sv();rrs();tab('s');
 const full=st.mr&&!new RegExp(st.mr,'i').test(q)?q+' '+st.mr:q;$('sr').innerHTML='<div class="empty">검색 중…</div>';const L=await ytSearch(full);
 if(!L){$('sr').innerHTML='<div class="empty">검색 서버에 연결하지 못했어요. 잠시 후 다시 시도하세요.</div>';return}$('sr').innerHTML='<div class="h">🔎 '+esc(full)+'</div>';const box=document.createElement('div');$('sr').appendChild(box);list(box,L,'s','결과 없음')}
async function home(){const C=JSON.parse(sessionStorage.k1h||'null');let L=C&&Date.now()-C.t<1800000?C.L:null;$('sr').innerHTML='<div class="empty">인기 노래방 곡 불러오는 중…</div>';
 if(!L){L=[];for(const k of ['노래방 인기곡','TJ 노래방 인기차트','금영 노래방 인기곡']){const r=await ytSearch(k);if(r)L=L.concat(r.slice(0,10));if(L.length>=24)break}const seen={};L=L.filter(x=>!seen[x.id]&&(seen[x.id]=1));if(L.length)sessionStorage.k1h=JSON.stringify({t:Date.now(),L})}
 if(!L.length){$('sr').innerHTML='<div class="empty">추천 목록을 불러오지 못했어요 — 검색해 보세요</div>';return}$('sr').innerHTML='<div class="h">🔥 지금 인기 노래방</div>';const b=document.createElement('div');$('sr').appendChild(b);list(b,L,'s','')}
function rrs(){const c=$('rs');c.innerHTML='';st.rs.forEach(s=>{const b=document.createElement('button');b.textContent='🕘 '+s;b.onclick=()=>search(s);c.appendChild(b)})}
function mrT(){st.mr=st.mr=='노래방'?'MR':st.mr=='MR'?'':'노래방';sv();$('bmr').textContent=st.mr||'원곡';$('bmr').classList.toggle('on',!!st.mr)}
// --- 예약 / 즐겨찾기 / 최근 ---
function slim(x){return{id:x.id,t:x.t,c:x.c,d:x.d,th:x.th}}
function reserve(x,top){const s=slim(x);if(!CUR&&!st.q.length){playNow(s);return}if(top)st.q.unshift(s);else st.q.push(s);sv();rq();toast((top?'우선예약: ':'예약: ')+x.t.slice(0,30))}
function mv(i,d){const j=i+d;if(j<0||j>=st.q.length)return;[st.q[i],st.q[j]]=[st.q[j],st.q[i]];sv();rq()}
function rq(){$('qn').textContent=st.q.length?'('+st.q.length+')':'';list($('pq'),st.q,'q','예약된 곡이 없어요');
 if(CUR){const h=document.createElement('div');h.className='h';h.textContent='▶ 지금: '+CUR.t;$('pq').prepend(h)}}
function favT(x){const i=st.fav.findIndex(f=>f.id==x.id);if(i>=0){st.fav.splice(i,1);toast('즐겨찾기 해제')}else{st.fav.unshift(slim(x));toast('⭐ 즐겨찾기 추가')}sv();rf()}
function rf(){list($('pf'),st.fav,'f','⭐ 를 눌러 즐겨찾기를 추가하세요')}
function rr(){list($('pr'),st.rec,'r','최근 부른 곡이 없어요')}
function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));['s','q','f','r'].forEach(k=>$('p'+k).classList.toggle('on',k==t));if(t=='q')rq();if(t=='f')rf();if(t=='r')rr()}
// --- 플레이어 (YouTube IFrame API) ---
let YP=null,YR=false,CUR=null,PEND=null;
function onYouTubeIframeAPIReady(){YP=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1,fs:0},
 events:{onReady:()=>{YR=true;try{YP.setVolume(st.vol)}catch(e){}if(PEND){const p=PEND;PEND=null;load(p)}},onStateChange:e=>{if(e.data===0)next(true);$('bpp').textContent=e.data===1?'⏸':'▶'},onError:()=>{toast('재생할 수 없는 영상 — 다음 곡으로');setTimeout(()=>next(true),1500)}}})}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
(function(){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)})();
function load(x){$('idle').style.display='none';if(!YR){PEND=x;return}YP.loadVideoById(x.id);try{YP.unMute();YP.setVolume(st.vol)}catch(e){}}
function playNow(x){CUR=slim(x);st.cur=CUR;st.rec=[CUR].concat(st.rec.filter(r=>r.id!=CUR.id)).slice(0,40);sv();load(CUR);lyrics(CUR);rq();$('ofs').textContent=(st.off[CUR.id]||0).toFixed(1)+'s';toast('🎤 '+CUR.t.slice(0,40))}
function next(auto){if(!st.q.length){if(auto){CUR=null;st.cur=null;sv();$('idle').style.display='';$('l1').textContent='♪ 예약곡이 모두 끝났어요';$('l2').textContent='';LY=null;rq()}else toast('예약된 곡이 없어요');return}const x=st.q.shift();sv();playNow(x)}
function pp(){if(!YR||!CUR)return;const s=YP.getPlayerState();s===1?YP.pauseVideo():YP.playVideo()}
function restart(){if(YR&&CUR){YP.seekTo(0,true);YP.playVideo()}}
function vol(d){st.vol=Math.max(0,Math.min(100,st.vol+d));sv();$('vv').textContent=st.vol;try{YP&&YP.setVolume(st.vol);if(st.vol>0)YP.unMute()}catch(e){}}

// --- 가사 (lrclib.net, 세션 메모리만) ---
let LY=null;
function clean(t){return t.replace(/\[[^\]]*\]|\([^)]*\)|【[^】]*】|<[^>]*>|「[^」]*」/g,' ').replace(/\b(TJ|KY|MR|Karaoke|KARAOKE|Instrumental|Inst)\b/gi,' ').replace(/노래방|금영|태진|반주|가사|lyrics?|노래|No\.?\s*\d+|\d{4,6}|official|M\/?V/gi,' ').replace(/[|/·_~"'“”]+/g,' ').replace(/\s+/g,' ').trim()}
function parseLRC(s){const L=[];(s||'').split('\n').forEach(l=>{const m=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];const tx=l.replace(/\[[^\]]*\]/g,'').trim();m.forEach(x=>L.push({t:+x[1]*60+ +x[2],x:tx}))});return L.sort((a,b)=>a.t-b.t).filter(l=>l.x)}
async function lyrics(x){LY=null;const id=x.id;$('l1').textContent='♪ 가사 찾는 중…';$('l2').textContent='';$('lsrc').textContent='';$('lcd').innerHTML='';
 const c=clean(x.t),parts=c.split(/\s+-\s+|\s-|-\s/).map(s=>s.trim()).filter(Boolean);const B='https://lrclib.net/api/';let R=[];
 const add=a=>{if(Array.isArray(a))R=R.concat(a);else if(a&&a.id)R.push(a)};
 add(await jget(B+'search?q='+encodeURIComponent(c),9000));
 if(!R.some(r=>r.syncedLyrics)&&parts.length>=2){add(await jget(B+'search?track_name='+encodeURIComponent(parts[0])+'&artist_name='+encodeURIComponent(parts[1])));add(await jget(B+'search?track_name='+encodeURIComponent(parts[1])+'&artist_name='+encodeURIComponent(parts[0])))}
 if(!R.length&&parts.length>=2)add(await jget(B+'get?track_name='+encodeURIComponent(parts[0])+'&artist_name='+encodeURIComponent(parts[1])));
 if(!CUR||CUR.id!=id)return;const dur=x.d||0;const sc=r=>(r.syncedLyrics?0:1000)+(dur&&r.duration?Math.abs(r.duration-dur):30);R.sort((a,b)=>sc(a)-sc(b));const r=R[0];
 if(!r||(!r.syncedLyrics&&!r.plainLyrics)){$('l1').textContent='가사 없음';$('l2').textContent=c;return}
 $('lsrc').textContent='가사: lrclib · '+(r.artistName||'')+' - '+(r.trackName||'');
 if(r.syncedLyrics){LY={id,L:parseLRC(r.syncedLyrics),plain:null};$('l1').textContent='♪ '+(r.trackName||'');$('l2').textContent=r.artistName||''}
 else{LY={id,L:null,plain:r.plainLyrics.split('\n').filter(Boolean)};$('l1').textContent=LY.plain[0]||'';$('l2').textContent=(LY.plain[1]||'')+' (싱크 가사 없음)'}}

 let i=-1;for(let k=0;k<L.length;k++){if(L[k].t<=t)i=k;else break}
 const cd=$('lcd');if(i<0&&L.length){const r=L[0].t-t;cd.innerHTML=r<=4.5&&r>0?[3,2,1].map(n=>'<i class="'+(r<=n-1?'off':'')+'"></i>').join(''):''}else cd.innerHTML='';
 if(i!=LI){LI=i;const a=i>=0?L[i]:null,b=L[i+1];const l1=$('l1');l1.innerHTML='';if(a){const s=document.createElement('span');s.textContent=a.x;l1.appendChild(s)}else l1.textContent=i<0?'♪ 전주 중…':'';$('l2').textContent=b?b.x:''}}

const EN=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']],SY=[['1','2','3','4','5','6','7','8','9','0'],['-','/',':','(',')','&','@','.',','],['?','!','\'','#','%','+','=']];

 const row=keys=>{const r=document.createElement('div');r.className='kr';keys.forEach(k=>{const b=document.createElement('button');if(typeof k=='string'){let c=k;if(KB.sh&&!KB.sym)c=KB.ko?(KS[k]||k):k.toUpperCase();b.textContent=c;b.dataset.c=c}else{b.textContent=k.t;b.className=k.c||'f';b.dataset.a=k.a}r.appendChild(b)});Kk.appendChild(r)};
 row(L[0]);row(L[1]);row([{t:KB.sym?'':'⇧',a:'sh',c:'f w2'+(KB.sh?' on':'')}].concat(L[2]).concat([{t:'⌫',a:'bs',c:'f w2'}]));
 row([{t:KB.sym?'가':'123',a:'sym',c:'f w2'},{t:KB.ko?'한/영 ▸A':'한/영 ▸한',a:'ko',c:'f w2'},{t:'',a:'sp',c:'sp'},{t:'검색',a:'go',c:'go'}]);
 $('kbS').textContent=KB.st.text;KB.f.value=KB.st.text;const T_=$('kbT');T_.scrollLeft=T_.scrollWidth}

 else if(a=='ko'){HG.commit(S);KB.ko=!KB.ko;KB.sym=KB.sh=false;st.kbko=KB.ko;sv()}else if(a=='sym'){HG.commit(S);KB.sym=!KB.sym;KB.sh=false}
 else if(a=='go'){KB.f.value=S.text.trim();kbClose();search();return}kbRender()}
